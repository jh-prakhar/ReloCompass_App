    - generic [ref=e454]:
      - generic [ref=e455]: About ReloCompass
      - heading "Built to make global relocation accessible and safe" [level=1] [ref=e456]
      - paragraph [ref=e457]: ReloCompass is an AI-powered platform that helps people from India and Nepal relocate abroad for education or employment. We combine AI guidance, verified listings, job matching, and community support into one integrated platform.
    - generic [ref=e460]:
      - heading "What is ReloCompass?" [level=2] [ref=e461]
      - generic [ref=e462]:
        - paragraph [ref=e463]: "ReloCompass is a web platform designed to support the complete relocation journey — from the first decision to move abroad, through preparation, arrival, and settling into a new country. It serves three roles: students pursuing education, skilled workers seeking jobs, and employers looking to hire international talent."
        - paragraph [ref=e464]: The platform offers an AI-powered assistant that answers relocation questions 24/7, an accommodation hub with safety-rated listings, a job board with employer-posted opportunities, transportation guides for major cities, a budget planner for cost-of-living estimation, relocation checklists, and a community hub for cultural and professional support groups.
    - generic [ref=e467]:
      - generic [ref=e468]: The Problem We Solve
      - heading "Why was ReloCompass created?" [level=2] [ref=e469]
      - paragraph [ref=e470]: "Every year, hundreds of thousands of students and professionals from India and Nepal move abroad. The process is complex, stressful, and filled with uncertainty. Here are the key challenges we address:"
      - generic [ref=e471]:
        - generic [ref=e472]:
          - img [ref=e474]
          - heading "Fragmented Information" [level=3] [ref=e479]
          - paragraph [ref=e480]: Relocation requires juggling dozens of sources — visa portals, university sites, housing platforms, and forums. We bring it all together in one place.
        - generic [ref=e481]:
          - img [ref=e483]
          - heading "Trust & Safety Concerns" [level=3] [ref=e485]
          - paragraph [ref=e486]: International movers are vulnerable to scams, from fake landlords to fraudulent job offers. ReloCompass includes verification tools and scam-prevention guidance.
        - generic [ref=e487]:
          - img [ref=e489]
          - heading "Language & Cultural Barriers" [level=3] [ref=e491]
          - paragraph [ref=e492]: Understanding local norms, tenant rights, and professional etiquette in a new country can be overwhelming. The AI assistant provides culturally-aware guidance.
        - generic [ref=e493]:
          - img [ref=e495]
          - heading "Social Isolation" [level=3] [ref=e500]
          - paragraph [ref=e501]: Moving abroad means leaving behind support networks. The community hub helps you connect with people from your home country who understand the journey.
