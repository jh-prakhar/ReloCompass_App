  <div class="mobile-menu" id="mobile-menu">
    <a href="dashboard.html" data-i18n="nav.dashboard">Dashboard</a>
    <a href="assistant.html" data-i18n="nav.assistant">AI Assistant</a>

    <div class="mobile-actions"></div>
  </div>

  <main style="max-width:1100px;margin:0 auto;padding:7rem 1.25rem 3rem">
    <header style="margin-bottom:1.5rem">
      <h1 style="font-size:2rem;font-weight:800">Community chat</h1>
      <p style="color:var(--text-secondary);margin-top:0.35rem">
        Talk live with others on the same journey — global room plus dedicated topics.
      </p>
    </header>

    <div class="community-layout">
      <aside class="community-rooms" id="community-rooms" aria-label="Chat rooms"></aside>

      <section class="community-panel card">
        <div class="community-head">
          <div>
            <strong id="room-title">🌍 Global</strong>
            <span class="presence-pill" id="presence-pill">—</span>
          </div>
          <span class="conn-status" id="conn-status" data-state="connecting">Connecting…</span>
        </div>
        <div class="community-messages" id="community-messages" aria-live="polite"></div>
        <form class="community-composer" id="community-form">
          <input type="text" id="community-input" placeholder="Type a message…" maxlength="1000"
                 autocomplete="off" aria-label="Message">
          <button type="submit" class="btn btn-primary" id="community-send">Send</button>
        </form>
        <p class="community-note" id="community-note" hidden>Log in to join the conversation.</p>
      </section>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/main.js"></script>
  <script src="js/community.js"></script>
</body>
</html>
