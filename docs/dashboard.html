  <!-- ===== DASHBOARD ===== -->
  <section class="page-hero" style="padding-bottom:2rem">
    <div class="hero-orb hero-orb-1"></div>
    <div class="container">
      <div class="animate-fadeIn" id="welcome-section">
        <span class="badge badge-electric">Dashboard</span>
        <h1 id="welcome-heading" style="margin-top:1rem">Welcome to ReloCompass</h1>
        <p id="welcome-text" style="margin-top:0.5rem;color:var(--text-secondary)">Loading your dashboard...</p>
      </div>
    </div>
  </section>

  <!-- ===== DASHBOARD CARDS ===== -->
  <section class="section" style="padding-top:2rem">
    <div class="container">
      <div class="features-grid" id="dash-grid">
        <!-- Cards filled by JS -->
      </div>

      <!-- Profile section -->
      <div id="profile-section" style="margin-top:3rem;max-width:48rem;margin-left:auto;margin-right:auto;display:none">
        <div class="contact-form-card" style="padding:2rem">
          <h2 style="margin-bottom:1.5rem">Your Profile</h2>
          <div class="form-group">
            <label for="profile-name">Full Name</label>
            <input type="text" id="profile-name" placeholder="Your name">
          </div>
          <div class="form-group">
            <label for="profile-phone">Phone</label>
            <input type="text" id="profile-phone" placeholder="Your phone number">
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
            <div class="form-group">
              <label for="profile-country">Country</label>
              <input type="text" id="profile-country" placeholder="Your country">
            </div>
            <div class="form-group">
              <label for="profile-city">City</label>
              <input type="text" id="profile-city" placeholder="Your city">
            </div>
          </div>
          <div class="form-group">
            <label for="profile-bio">Bio</label>
            <textarea id="profile-bio" rows="3" placeholder="Tell us about yourself..."></textarea>
          </div>
          <button class="btn btn-gradient" id="save-profile-btn" style="margin-top:0.5rem">Save Profile</button>
          <span id="profile-saved-msg" style="display:none;margin-left:1rem;font-size:0.875rem;color:var(--emerald)">✓ Saved</span>
        </div>
      </div>
    </div>
  </section>

  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/main.js"></script>
  <script>

      // Redirect to login if not authenticated
      if (!Auth.isLoggedIn()) {
        window.location.href = Auth.getPagePath('login.html');
        return;

      const user = Auth.getUser();
      const heading = document.getElementById('welcome-heading');
      const welcomeText = document.getElementById('welcome-text');
      const grid = document.getElementById('dash-grid');
      const profileSection = document.getElementById('profile-section');

      heading.textContent = `Welcome, ${user.name.split(' ')[0]}!`;
      const roleLabel = user.role === 'employer' ? 'Employer' : user.role === 'job_seeker' ? 'Job Seeker' : user.role === 'admin' ? 'Admin' : 'Student';

        student: [

          { title: 'Settings', desc: 'Language, password and account preferences.', icon: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>', url: 'settings.html', color: 'violet' },
        ],
        job_seeker: [
          { title: 'AI Assistant', desc: 'Practice interviews, plan your move, and get job-market answers.', icon: '<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9 9h.01M15 9h.01M8.5 14.5s1.5 1.5 3.5 1.5 3.5-1.5 3.5-1.5"/>', url: 'assistant.html', color: 'cyan' },

          { title: 'Transportation', desc: 'Official operators, airport transfers and monthly passes.', icon: '<rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/>', url: 'transport.html', color: 'blue' },

          { title: 'Profile Settings', desc: 'Update your personal information and preferences.', icon: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>', url: '#profile', color: 'blue', action: 'toggleProfile' },

          { title: 'AI Assistant', desc: 'Ask about sponsorship rules and hiring international talent.', icon: '<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9 9h.01M15 9h.01M8.5 14.5s1.5 1.5 3.5 1.5 3.5-1.5 3.5-1.5"/>', url: 'assistant.html', color: 'cyan' },
          { title: 'Post a Job', desc: 'Create a job listing to find talent from India & Nepal.', icon: '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>', url: 'employers.html', color: 'blue' },
          { title: 'My Posted Jobs', desc: 'Review applicants and manage your listings.', icon: '<path d="M3 21h18M5 21V7l8-4v18M19 21V11l-6-4"/>', url: 'employers.html#my-jobs-list', color: 'violet' },

          { title: 'Profile Settings', desc: 'Update your employer profile and company info.', icon: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>', url: '#profile', color: 'blue', action: 'toggleProfile' },
        ],
        admin: [
          { title: 'AI Assistant', desc: 'Ask anything about relocation topics.', icon: '<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9 9h.01M15 9h.01M8.5 14.5s1.5 1.5 3.5 1.5 3.5-1.5 3.5-1.5"/>', url: 'assistant.html', color: 'cyan' },
          { title: 'Browse Jobs', desc: 'See all live job postings.', icon: '<path d="M21 13.255A23.93 23.93 0 0 1 12 15c-3.18 0-6.22-.62-9-1.745M16 6V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2m4 6h.01M5 20h14a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2z"/>', url: 'jobs.html', color: 'blue' },

      const cards = cardsByRole[user.role] || cardsByRole.student;

      grid.innerHTML = cards.map(card => `
        <div class="feature-card" style="cursor:pointer" ${card.action ? `onclick="${card.action}()"` : `onclick="window.location.href='${card.url}'"`}>
          <div class="feature-icon ${card.color}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${card.icon}</svg></div>
          <h3>${card.title}</h3>
          <p>${card.desc}</p>
        </div>
      `).join('');

      // Profile toggle
      window.toggleProfile = function () {
        if (profileSection.style.display === 'none') {
          profileSection.style.display = 'block';
          profileSection.scrollIntoView({ behavior: 'smooth' });
          // Fill in current data
          document.getElementById('profile-name').value = user.name || '';
          document.getElementById('profile-phone').value = user.phone || '';
          document.getElementById('profile-country').value = user.country || '';
          document.getElementById('profile-city').value = user.city || '';
          document.getElementById('profile-bio').value = user.bio || '';
        } else {
          profileSection.style.display = 'none';
        }
      };

      // Save profile
      document.getElementById('save-profile-btn').addEventListener('click', async function () {
        const btn = this;
        const payload = {
          name: document.getElementById('profile-name').value.trim() || null,
          phone: document.getElementById('profile-phone').value.trim() || null,
          country: document.getElementById('profile-country').value.trim() || null,
          city: document.getElementById('profile-city').value.trim() || null,
          bio: document.getElementById('profile-bio').value.trim() || null,
        };
        btn.disabled = true;
        btn.textContent = 'Saving...';
        try {
          const res = await Auth.apiRequest('/users/me', {
            method: 'PUT',
            body: JSON.stringify(payload),
          });
          if (res.ok) {
            const updated = await res.json();
            localStorage.setItem('relocompass_user', JSON.stringify(updated));
            document.getElementById('profile-saved-msg').style.display = 'inline';
            setTimeout(() => document.getElementById('profile-saved-msg').style.display = 'none', 2000);
          }
        } catch (err) {
          alert('Failed to save profile. Is the backend running?');
        }
        btn.disabled = false;
        btn.textContent = 'Save Profile';
      });
    })();
    // ── Recent notifications (dashboard) ──
    (async function loadDashNotifs() {
      const wrap = document.getElementById('dash-notifications');
      const list = document.getElementById('dash-notif-list');
      if (!wrap || !list) return;
      try {
        const res = await Auth.apiRequest('/notifications/?limit=5');
        if (!res.ok) return;
        const items = await res.json();
        if (!items.length) return;
        wrap.style.display = 'block';
        const esc2 = (str) => { const d = document.createElement('div'); d.textContent = str == null ? '' : String(str); return d.innerHTML.replace(/"/g, '&quot;').replace(/'/g, '&#39;'); };
        const timeAgo2 = (iso) => { if (!iso) return ''; const s = Math.floor((Date.now() - new Date(iso).getTime())/1000); if (s<60) return 'just now'; if (s<3600) return Math.floor(s/60)+'m ago'; if (s<86400) return Math.floor(s/3600)+'h ago'; return Math.floor(s/86400)+'d ago'; };
        list.innerHTML = items.map(n => `
          <div class="saved-card" style="padding:0.9rem 1.1rem;${n.is_read ? 'opacity:0.65;' : 'border-left:3px solid var(--electric);'}">
            <div style="font-weight:600;font-size:0.9rem">${esc2(n.title)}${n.is_read ? '' : ' <span style="font-size:0.65rem;color:var(--electric);font-weight:700">NEW</span>'}</div>
            ${n.body ? `<div style="font-size:0.8rem;color:var(--text-muted);margin-top:0.2rem">${esc2(n.body)}</div>` : ''}
            <div style="font-size:0.7rem;color:var(--text-muted);margin-top:0.25rem">${timeAgo2(n.created_at)}</div>
          </div>`).join('');
        document.getElementById('dash-notif-readall').addEventListener('click', async () => {
          try {
            await Auth.apiRequest('/notifications/read-all', { method: 'POST' });
            list.querySelectorAll('[style*="opacity"]').forEach(el => el.style.opacity = '0.65');
            list.querySelectorAll('span').forEach(sp => { if (sp.textContent === 'NEW') sp.remove(); });
            if (window.Notif) Notif.refreshUnread();
          } catch { }
        });
      } catch { /* offline — section stays hidden */ }
    })();
  </script>
