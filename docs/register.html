<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — ReloCompass</title>
  <meta name="description" content="Create your free ReloCompass account.">
  <meta name="theme-color" content="#0F172A">
  <link rel="icon" type="image/svg+xml" href="assets/icons/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>
  <div class="scroll-progress" id="scroll-progress"></div>

  <!-- ===== NAVBAR ===== -->
  <header class="navbar scrolled" id="navbar">
    <nav class="container navbar-inner">
      <a href="index.html" class="nav-brand">
        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><rect width="200" height="200" rx="44" fill="#1E2A45"/><g transform="translate(34,24) scale(0.94)"><path d="M 60 6 C 32 6 10 28 10 56 C 10 85 36 108 60 137 C 84 108 110 85 110 56 C 110 28 88 6 60 6 Z" fill="none" stroke="#F6EFE2" stroke-width="6" stroke-linejoin="round"/><circle cx="60" cy="58" r="34" fill="none" stroke="#F6EFE2" stroke-width="3.5"/><polygon points="53,58 60,21 67,58" fill="#F6EFE2"/><polygon points="53,58 60,123 67,58" fill="#C1552C"/><circle cx="60" cy="58" r="7" fill="#1E2A45" stroke="#F6EFE2" stroke-width="2.5"/></g></svg>
        <span class="brand-text">Relo<span>Compass</span></span>
      </a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="assistant.html">AI Assistant</a>
        <a href="index.html#features">Features</a>
        <a href="index.html#students">Students</a>
        <a href="jobs.html">Jobs</a>
        <a href="employers.html">Employers</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </div>
      <div class="nav-actions"></div>
      <button class="mobile-toggle" id="mobile-toggle" aria-label="Toggle menu">
        <svg class="icon-open" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        <svg class="icon-close" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </nav>
    <div class="mobile-menu" id="mobile-menu">
      <a href="index.html">Home</a>
      <a href="assistant.html">AI Assistant</a>
      <a href="index.html#features">Features</a>
        <a href="index.html#students">Students</a>
      <a href="jobs.html">Jobs</a>
      <a href="employers.html">Employers</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
      <div class="mobile-actions"></div>
    </div>
  </header>

  <!-- ===== REGISTER SECTION ===== -->
  <section style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding-top:6rem;padding-bottom:3rem;background:var(--cream)">
    <div class="container" style="max-width:480px">
      <div class="animate-fadeIn" style="text-align:center;margin-bottom:2rem">
        <a href="index.html" class="nav-brand" style="justify-content:center;margin-bottom:1rem">
          <svg width="48" height="48" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><rect width="200" height="200" rx="44" fill="#1E2A45"/><g transform="translate(34,24) scale(0.94)"><path d="M 60 6 C 32 6 10 28 10 56 C 10 85 36 108 60 137 C 84 108 110 85 110 56 C 110 28 88 6 60 6 Z" fill="none" stroke="#F6EFE2" stroke-width="6" stroke-linejoin="round"/><circle cx="60" cy="58" r="34" fill="none" stroke="#F6EFE2" stroke-width="3.5"/><polygon points="53,58 60,21 67,58" fill="#F6EFE2"/><polygon points="53,58 60,123 67,58" fill="#C1552C"/><circle cx="60" cy="58" r="7" fill="#1E2A45" stroke="#F6EFE2" stroke-width="2.5"/></g></svg>
        </a>
        <h1 style="font-size:1.75rem;font-weight:800;color:var(--midnight)">Create Your Account</h1>
        <p style="color:var(--text-secondary);margin-top:0.5rem">Join ReloCompass — it's free</p>
      </div>

      <div class="contact-form-card animate-fadeIn" style="padding:2rem">
        <div id="alert-box" style="display:none;margin-bottom:1.5rem;padding:0.75rem 1rem;border-radius:var(--radius-md);font-size:0.875rem"></div>

        <form id="register-form" novalidate>
          <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" placeholder="Your name" autocomplete="name" required>
            <div class="form-error" id="name-error" style="display:none"></div>
          </div>
          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
            <div class="form-error" id="email-error" style="display:none"></div>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="At least 6 characters" autocomplete="new-password" required>
            <div class="form-error" id="password-error" style="display:none"></div>
          </div>

          <!-- Role Selection -->
          <div class="form-group">
            <label>I am a...</label>
            <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:0.5rem;margin-top:0.375rem">
              <label style="cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:0.375rem;padding:0.75rem;border:1.5px solid var(--border);border-radius:var(--radius-md);transition:all 0.2s" class="role-option" data-role="student">
                <input type="radio" name="role" value="student" checked style="display:none">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--electric)" stroke-width="2"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
                <span style="font-size:0.75rem;font-weight:600;color:var(--midnight)">Student</span>
              </label>
              <label style="cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:0.375rem;padding:0.75rem;border:1.5px solid var(--border);border-radius:var(--radius-md);transition:all 0.2s" class="role-option" data-role="job_seeker">
                <input type="radio" name="role" value="job_seeker" style="display:none">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--electric)" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
                <span style="font-size:0.75rem;font-weight:600;color:var(--midnight)">Job Seeker</span>
              </label>
              <label style="cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:0.375rem;padding:0.75rem;border:1.5px solid var(--border);border-radius:var(--radius-md);transition:all 0.2s" class="role-option" data-role="employer">
                <input type="radio" name="role" value="employer" style="display:none">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--electric)" stroke-width="2"><path d="M3 21h18"/><path d="M5 21V7l8-4v18"/><path d="M19 21V11l-6-4"/></svg>
                <span style="font-size:0.75rem;font-weight:600;color:var(--midnight)">Employer</span>
              </label>
            </div>
          </div>

          <button type="submit" class="btn btn-gradient btn-lg" id="submit-btn" style="width:100%;margin-top:0.5rem">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
            <span>Create Account</span>
          </button>
        </form>

        <p style="text-align:center;margin-top:1.5rem;font-size:0.875rem;color:var(--text-secondary)">
          Already have an account?
          <a href="login.html" style="color:var(--electric);font-weight:600">Login</a>
        </p>
      </div>

      <p style="text-align:center;margin-top:1.5rem;font-size:0.75rem;color:var(--text-muted)">
        <a href="index.html" style="color:var(--text-muted)">← Back to home</a>
      </p>
    </div>
  </section>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script>
    // Redirect if already logged in
    if (Auth.isLoggedIn()) {
      window.location.href = Auth.getPagePath('dashboard.html');
    }

    // Role selection styling
    const roleOptions = document.querySelectorAll('.role-option');
    function selectRole(selected) {
      roleOptions.forEach(opt => {
        const radio = opt.querySelector('input[type="radio"]');
        if (opt === selected) {
          radio.checked = true;
          opt.style.borderColor = 'var(--electric)';
          opt.style.background = 'rgba(59,130,246,0.05)';
        } else {
          opt.style.borderColor = '';
          opt.style.background = '';
        }
      });
    }
    roleOptions.forEach(opt => opt.addEventListener('click', () => selectRole(opt)));
    selectRole(roleOptions[0]); // Default: student

    const form = document.getElementById('register-form');
    const alertBox = document.getElementById('alert-box');

    function showAlert(message, type) {
      alertBox.style.display = 'block';
      alertBox.textContent = message;
      if (type === 'error') {
        alertBox.style.background = 'rgba(239,68,68,0.1)';
        alertBox.style.color = '#DC2626';
        alertBox.style.border = '1px solid rgba(239,68,68,0.2)';
      } else {
        alertBox.style.background = 'rgba(16,185,129,0.1)';
        alertBox.style.color = '#059669';
        alertBox.style.border = '1px solid rgba(16,185,129,0.2)';
      }
    }

    form.addEventListener('submit', async function (e) {
      e.preventDefault();

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const role = document.querySelector('input[name="role"]:checked').value;
      const submitBtn = document.getElementById('submit-btn');

      // Validate
      let hasError = false;
      if (!name || name.length < 2) {
        document.getElementById('name-error').textContent = 'Please enter your name';
        document.getElementById('name-error').style.display = 'block';
        hasError = true;
      } else { document.getElementById('name-error').style.display = 'none'; }

      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        document.getElementById('email-error').textContent = 'Please enter a valid email';
        document.getElementById('email-error').style.display = 'block';
        hasError = true;
      } else { document.getElementById('email-error').style.display = 'none'; }

      if (!password || password.length < 6) {
        document.getElementById('password-error').textContent = 'Password must be at least 6 characters';
        document.getElementById('password-error').style.display = 'block';
        hasError = true;
      } else { document.getElementById('password-error').style.display = 'none'; }

      if (hasError) return;

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span>Creating account...</span>';
      alertBox.style.display = 'none';

      const result = await Auth.register(name, email, password, role);

      if (result.success) {
        showAlert('Account created! Redirecting to dashboard...', 'success');
        setTimeout(() => {
          window.location.href = Auth.getPagePath('dashboard.html');
        }, 1000);
      } else {
        showAlert(result.error, 'error');
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg><span>Create Account</span>';
      }
    });
  </script>
</body>
</html>
