<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — ReloCompass</title>
  <meta name="description" content="Set a new ReloCompass password using your reset link.">
  <meta name="theme-color" content="#0F172A">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ReloCompass">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="icon" type="image/svg+xml" href="assets/icons/logo.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <section class="auth-section">
    <div class="auth-container">
      <div class="auth-hero" style="text-align:center;margin-bottom:1.75rem">
        <div style="font-size:3rem;line-height:1">🧭</div>
        <h1 style="margin-top:0.5rem" data-i18n="reset.title">Choose a new password</h1>
        <p style="color:var(--text-secondary);margin-top:0.5rem" data-i18n="reset.subtitle">Enter a new password for your ReloCompass account.</p>
      </div>

      <div class="contact-form-card animate-fadeIn" style="padding:2rem">
        <div id="reset-msg" style="display:none;margin-bottom:1.5rem;padding:0.75rem 1rem;border-radius:var(--radius-md);font-size:0.875rem"></div>

        <form id="reset-form" novalidate>
          <div class="form-group">
            <label for="new-password" data-i18n="reset.newPassword">New password</label>
            <input type="password" id="new-password" name="new-password" autocomplete="new-password"
                   placeholder="At least 6 characters" data-i18n-placeholder="reset.newPasswordPh" minlength="6" maxlength="128" required>
          </div>
          <div class="form-group">
            <label for="confirm-password" data-i18n="reset.confirmPassword">Confirm new password</label>
            <input type="password" id="confirm-password" name="confirm-password" autocomplete="new-password"
                   placeholder="Repeat your new password" data-i18n-placeholder="reset.confirmPasswordPh" minlength="6" maxlength="128" required>
          </div>
          <button type="submit" class="btn btn-gradient btn-lg" id="reset-submit" style="width:100%;margin-top:0.5rem">
            <span data-i18n="reset.submit">Update password</span>
          </button>
        </form>
      </div>

      <p style="text-align:center;margin-top:1.5rem;font-size:0.75rem;color:var(--text-muted)">
        <a href="login.html" style="color:var(--text-muted)" data-i18n="reset.backToLogin">← Back to login</a>
      </p>
    </div>
  </section>

  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script>
    (function () {
      'use strict';
      const params = new URLSearchParams(location.search);
      const token = params.get('token') || '';
      const form = document.getElementById('reset-form');
      const msgEl = document.getElementById('reset-msg');
      const submit = document.getElementById('reset-submit');

      function show(text, ok) {
        msgEl.style.display = 'block';
        msgEl.textContent = text;
        msgEl.style.background = ok ? 'rgba(16,185,129,0.12)' : 'rgba(239,68,68,0.12)';
        msgEl.style.color = ok ? '#059669' : '#dc2626';
      }
      function tr(key, fallback) {
        return window.I18N_UTIL ? I18N_UTIL.t(key) : fallback;
      }

      if (!token) {
        show(tr('reset.missingToken', 'This reset link is missing its token. Request a new reset email from the login page.'), false);
        submit.disabled = true;
        return;
      }

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        const pw = document.getElementById('new-password').value;
        const confirm = document.getElementById('confirm-password').value;
        if (pw !== confirm) { show(tr('reset.mismatch', 'Passwords do not match.'), false); return; }
        if (pw.length < 6) { show(tr('reset.tooShort', 'Password must be at least 6 characters.'), false); return; }
        submit.disabled = true;
        submit.textContent = tr('reset.submit', 'Update password') + '…';
        try {
          const res = await fetch(API_CONFIG.API_URL + '/auth/password-reset/confirm', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: token, new_password: pw }),
          });
          const data = await res.json().catch(() => ({}));
          if (res.ok) {
            show(data.message || tr('reset.ok', 'Password updated — redirecting to login…'), true);
            setTimeout(function () { location.href = 'login.html'; }, 2200);
          } else {
            show(data.detail || tr('reset.fail', 'Could not update the password. The link may have expired.'), false);
            submit.disabled = false;
            submit.textContent = tr('reset.submit', 'Update password');
          }
        } catch (err) {
          show(tr('reset.network', 'Network error — please try again.'), false);
          submit.disabled = false;
          submit.textContent = tr('reset.submit', 'Update password');
        }
      });
    })();
  </script>
</body>
</html>
