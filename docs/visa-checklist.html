  <main style="max-width:860px;margin:0 auto;padding:7rem 1.25rem 3rem">
    <header style="margin-bottom:1.5rem">
      <h1 style="font-size:2rem;font-weight:800">🛂 Visa checklist generator</h1>
      <p style="color:var(--text-secondary);margin-top:0.35rem">
        Pick your destination and visa type — get an ordered document checklist with
        official sources for verification.
      </p>
    </header>

    <form class="card" id="visa-form" style="display:grid;grid-template-columns:1fr;gap:1rem;padding:1.5rem;margin-bottom:1.5rem">
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem">
        <div class="form-group" style="margin:0">
          <label for="visa-destination">Destination</label>
          <select id="visa-destination" required></select>
        </div>
        <div class="form-group" style="margin:0">
          <label for="visa-type">Visa type</label>
          <select id="visa-type" required></select>
        </div>
        <div class="form-group" style="margin:0">
          <label for="visa-situation">Your situation</label>
          <select id="visa-situation">
            <option value="">—</option>
            <option value="student">Student</option>
            <option value="job_seeker">Job seeker</option>
            <option value="family">Moving with family</option>
            <option value="with_kids">With children</option>
          </select>
        </div>
      </div>
      <div style="display:flex;gap:0.75rem;flex-wrap:wrap">
        <button type="submit" class="btn btn-primary" id="visa-generate">Generate checklist</button>
        <button type="button" class="btn btn-ghost" id="visa-print" hidden>🖨️ Print / save PDF</button>
      </div>
      <div id="visa-msg" style="display:none;padding:0.6rem 0.9rem;border-radius:8px;font-size:0.85rem"></div>
    </form>

    <section id="visa-result" hidden>
      <div class="card" style="padding:1.5rem;margin-bottom:1.25rem">
        <h2 id="visa-result-title" style="font-size:1.25rem;font-weight:800"></h2>
        <p id="visa-result-sub" style="color:var(--text-secondary);font-size:0.9rem;margin-top:0.3rem"></p>
        <div style="margin-top:0.9rem;display:flex;gap:1.5rem;flex-wrap:wrap;align-items:center">
          <strong id="visa-progress-label" style="font-size:0.9rem"></strong>
          <a id="visa-official" href="#" target="_blank" rel="noopener noreferrer" class="btn btn-ghost btn-sm">Official source ↗</a>
        </div>
        <div style="margin-top:0.6rem;height:8px;background:rgba(15,23,42,0.08);border-radius:999px;overflow:hidden">
          <div id="visa-progress-bar" style="height:100%;width:0;background:linear-gradient(90deg,#6366f1,#3b82f6);transition:width 0.3s ease"></div>
        </div>
      </div>
      <div id="visa-phases"></div>
      <p id="visa-disclaimer" style="font-size:0.75rem;color:var(--text-muted);margin-top:1rem"></p>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script src="js/visa.js"></script>
</body>
</html>
